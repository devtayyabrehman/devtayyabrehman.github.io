<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#101A24"/>
  <text x="72" y="92" fill="#EEF4F7" font-family="Arial,sans-serif" font-size="34" font-weight="700">Find the delay on the LCP path</text>
  <text x="72" y="132" fill="#AABAC6" font-family="Arial,sans-serif" font-size="20">Follow the main visible element from navigation to paint.</text>
  <rect x="72" y="218" width="232" height="150" fill="#182936" stroke="#57D6A3" stroke-width="2"/>
  <text x="98" y="260" fill="#63E2AE" font-family="Arial,sans-serif" font-size="20" font-weight="700">1 · DOCUMENT</text>
  <text x="98" y="305" fill="#EEF4F7" font-family="Arial,sans-serif" font-size="20">Redirects?</text>
  <text x="98" y="337" fill="#EEF4F7" font-family="Arial,sans-serif" font-size="20">Slow response?</text>
  <path d="M319 293h34m-14-14 14 14-14 14" stroke="#67DDB0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="366" y="218" width="232" height="150" fill="#182936" stroke="#57D6A3" stroke-width="2"/>
  <text x="392" y="260" fill="#63E2AE" font-family="Arial,sans-serif" font-size="20" font-weight="700">2 · DISCOVERY</text>
  <text x="392" y="305" fill="#EEF4F7" font-family="Arial,sans-serif" font-size="20">When is the hero</text>
  <text x="392" y="337" fill="#EEF4F7" font-family="Arial,sans-serif" font-size="20">resource requested?</text>
  <path d="M613 293h34m-14-14 14 14-14 14" stroke="#67DDB0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="660" y="218" width="232" height="150" fill="#182936" stroke="#57D6A3" stroke-width="2"/>
  <text x="686" y="260" fill="#63E2AE" font-family="Arial,sans-serif" font-size="20" font-weight="700">3 · DOWNLOAD</text>
  <text x="686" y="305" fill="#EEF4F7" font-family="Arial,sans-serif" font-size="20">Right size?</text>
  <text x="686" y="337" fill="#EEF4F7" font-family="Arial,sans-serif" font-size="20">Right priority?</text>
  <path d="M907 293h34m-14-14 14 14-14 14" stroke="#67DDB0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="954" y="218" width="174" height="150" fill="#182936" stroke="#57D6A3" stroke-width="2"/>
  <text x="976" y="260" fill="#63E2AE" font-family="Arial,sans-serif" font-size="20" font-weight="700">4 · PAINT</text>
  <text x="976" y="305" fill="#EEF4F7" font-family="Arial,sans-serif" font-size="20">Blocked by</text>
  <text x="976" y="337" fill="#EEF4F7" font-family="Arial,sans-serif" font-size="20">CSS or JS?</text>
  <path d="M72 431h1056" stroke="#405461" stroke-width="2"/>
  <text x="72" y="491" fill="#CFD9DF" font-family="Arial,sans-serif" font-size="20">Fix the slowest evidenced phase; do not optimize an image if the delay is server time.</text>
  <text x="72" y="535" fill="#63E2AE" font-family="Arial,sans-serif" font-size="20" font-weight="700">Compare like-for-like lab runs with real-user data.</text>
</svg>
