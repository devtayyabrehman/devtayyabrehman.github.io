<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" rx="28" fill="#100E18"/>
  <text x="72" y="84" fill="#F1EDFA" font-family="Arial,sans-serif" font-size="30" font-weight="700">Product Search: Request, Validate, Render</text>
  <text x="72" y="120" fill="#A99FBA" font-family="Arial,sans-serif" font-size="18">A realistic AJAX flow includes empty, loading, and error states.</text>
  <rect x="72" y="190" width="235" height="244" rx="18" fill="#1B1724" stroke="#A78BFA"/>
  <text x="98" y="230" fill="#C3A9FF" font-family="Arial,sans-serif" font-size="15" font-weight="700">1 · INPUT</text>
  <rect x="98" y="254" width="183" height="44" rx="9" fill="#0F0D15" stroke="#51465F"/>
  <text x="111" y="283" fill="#DED8E8" font-family="Arial,sans-serif" font-size="15">blue mug</text>
  <text x="98" y="343" fill="#B8AFC5" font-family="Arial,sans-serif" font-size="16">Debounce typing</text>
  <text x="98" y="374" fill="#B8AFC5" font-family="Arial,sans-serif" font-size="16">Cancel stale request</text>
  <path d="M322 306h85m-16-15 16 15-16 15" stroke="#BDA7F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="423" y="190" width="332" height="244" rx="18" fill="#141A25" stroke="#4D8EFF"/>
  <text x="451" y="230" fill="#7EABFF" font-family="Arial,sans-serif" font-size="15" font-weight="700">2 · WORDPRESS REST ROUTE</text>
  <text x="451" y="282" fill="#E3EAF5" font-family="monospace" font-size="16">GET /wp-json/wp/v2/posts</text>
  <path d="M451 305h276" stroke="#3B4658"/>
  <text x="451" y="342" fill="#C2CDDE" font-family="Arial,sans-serif" font-size="16">Validate query + permission</text>
  <text x="451" y="374" fill="#C2CDDE" font-family="Arial,sans-serif" font-size="16">Return limited JSON fields</text>
  <text x="451" y="406" fill="#C2CDDE" font-family="Arial,sans-serif" font-size="16">Never return private content</text>
  <path d="M770 306h85m-16-15 16 15-16 15" stroke="#BDA7F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="871" y="190" width="257" height="244" rx="18" fill="#152019" stroke="#00E87A"/>
  <text x="899" y="230" fill="#00E87A" font-family="Arial,sans-serif" font-size="15" font-weight="700">3 · INTERFACE</text>
  <text x="899" y="281" fill="#E2EEE5" font-family="Arial,sans-serif" font-size="17">Loading indicator</text>
  <text x="899" y="319" fill="#E2EEE5" font-family="Arial,sans-serif" font-size="17">Matching results</text>
  <text x="899" y="357" fill="#E2EEE5" font-family="Arial,sans-serif" font-size="17">Helpful empty state</text>
  <text x="899" y="395" fill="#E2EEE5" font-family="Arial,sans-serif" font-size="17">Recoverable error</text>
  <rect x="72" y="482" width="1056" height="70" rx="14" fill="#17131F"/>
  <text x="101" y="526" fill="#D8D0E4" font-family="Arial,sans-serif" font-size="18">Public reads can be unauthenticated; private data and write actions need server-side checks.</text>
</svg>
