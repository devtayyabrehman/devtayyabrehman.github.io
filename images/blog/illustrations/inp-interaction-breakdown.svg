<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#111827"/>
  <text x="72" y="92" fill="#E8EDFF" font-family="Arial,sans-serif" font-size="34" font-weight="700">Trace one slow interaction</text>
  <text x="72" y="132" fill="#A9B4C8" font-family="Arial,sans-serif" font-size="20">INP is affected by the complete path from input to the next visual update.</text>
  <rect x="72" y="226" width="310" height="160" fill="#172338" stroke="#6575E8" stroke-width="2"/>
  <text x="104" y="273" fill="#A8B4FF" font-family="Arial,sans-serif" font-size="20" font-weight="700">1 · INPUT DELAY</text>
  <text x="104" y="315" fill="#F1F3FA" font-family="Arial,sans-serif" font-size="21">What kept the main</text>
  <text x="104" y="346" fill="#F1F3FA" font-family="Arial,sans-serif" font-size="21">thread busy first?</text>
  <path d="M397 306h53m-16-15 16 15-16 15" stroke="#9EABFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="464" y="226" width="310" height="160" fill="#172338" stroke="#6575E8" stroke-width="2"/>
  <text x="496" y="273" fill="#A8B4FF" font-family="Arial,sans-serif" font-size="20" font-weight="700">2 · PROCESSING</text>
  <text x="496" y="315" fill="#F1F3FA" font-family="Arial,sans-serif" font-size="21">Which handler or task</text>
  <text x="496" y="346" fill="#F1F3FA" font-family="Arial,sans-serif" font-size="21">did the work?</text>
  <path d="M789 306h53m-16-15 16 15-16 15" stroke="#9EABFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="856" y="226" width="272" height="160" fill="#172338" stroke="#6575E8" stroke-width="2"/>
  <text x="888" y="273" fill="#A8B4FF" font-family="Arial,sans-serif" font-size="20" font-weight="700">3 · PRESENTATION</text>
  <text x="888" y="315" fill="#F1F3FA" font-family="Arial,sans-serif" font-size="21">What delayed the</text>
  <text x="888" y="346" fill="#F1F3FA" font-family="Arial,sans-serif" font-size="21">next painted frame?</text>
  <path d="M72 451h1056" stroke="#4B5874" stroke-width="2"/>
  <text x="72" y="509" fill="#C5CCE1" font-family="Arial,sans-serif" font-size="20">Use field data to find the affected action, then profile that action in a representative lab run.</text>
  <text x="72" y="553" fill="#9EABFF" font-family="Arial,sans-serif" font-size="20" font-weight="700">Change one cause. Retest the same user journey.</text>
</svg>
