<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#111A17"/>
  <text x="72" y="92" fill="#F0F5F2" font-family="Arial,sans-serif" font-size="34" font-weight="700">Check the URL in this order</text>
  <rect x="72" y="190" width="248" height="128" fill="#17231E" stroke="#00D987" stroke-width="2"/>
  <text x="102" y="235" fill="#00E89A" font-family="Arial,sans-serif" font-size="20" font-weight="700">1 · FETCH</text>
  <text x="102" y="275" fill="#F0F5F2" font-family="Arial,sans-serif" font-size="20">Status + redirects</text>
  <path d="M333 254h46m-15-15 15 15-15 15" stroke="#62E6AE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="392" y="190" width="248" height="128" fill="#17231E" stroke="#00D987" stroke-width="2"/>
  <text x="422" y="235" fill="#00E89A" font-family="Arial,sans-serif" font-size="20" font-weight="700">2 · ACCESS</text>
  <text x="422" y="275" fill="#F0F5F2" font-family="Arial,sans-serif" font-size="20">Robots + noindex</text>
  <path d="M653 254h46m-15-15 15 15-15 15" stroke="#62E6AE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="712" y="190" width="248" height="128" fill="#17231E" stroke="#00D987" stroke-width="2"/>
  <text x="742" y="235" fill="#00E89A" font-family="Arial,sans-serif" font-size="20" font-weight="700">3 · RENDER</text>
  <text x="742" y="275" fill="#F0F5F2" font-family="Arial,sans-serif" font-size="20">Content + links</text>
  <path d="M973 254h46m-15-15 15 15-15 15" stroke="#62E6AE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1032" y="190" width="96" height="128" fill="#17231E" stroke="#00D987" stroke-width="2"/>
  <text x="1048" y="235" fill="#00E89A" font-family="Arial,sans-serif" font-size="18" font-weight="700">4 ·</text>
  <text x="1043" y="269" fill="#F0F5F2" font-family="Arial,sans-serif" font-size="16">URL signal</text>
  <path d="M72 383h1056" stroke="#52665B" stroke-width="2"/>
  <text x="72" y="443" fill="#CFDDD3" font-family="Arial,sans-serif" font-size="20">Use URL Inspection to compare Google’s report with the page actually served.</text>
  <text x="72" y="487" fill="#9DAC9F" font-family="Arial,sans-serif" font-size="20">Fix the specific signal, then request recrawling if appropriate—not as a guarantee.</text>
</svg>
