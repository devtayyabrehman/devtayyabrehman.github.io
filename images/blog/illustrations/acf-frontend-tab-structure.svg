  <text x="299" y="242" fill="#F3EAFD" font-family="Arial,sans-serif" font-size="17">Overview</text>
  <rect x="390" y="211" width="95" height="48" rx="9" fill="#15151D" stroke="#635A6E"/>
  <text x="408" y="242" fill="#C6C0CE" font-family="Arial,sans-serif" font-size="17">Details</text>
