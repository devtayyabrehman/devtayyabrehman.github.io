<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" rx="28" fill="#0C111A"/>
  <text x="72" y="84" fill="#EEF3FC" font-family="Arial,sans-serif" font-size="30" font-weight="700">Inspect the Same URL in Three Places</text>
  <text x="72" y="120" fill="#8F9DB2" font-family="Arial,sans-serif" font-size="18">Each view answers a different rendering question.</text>
  <rect x="72" y="170" width="1056" height="92" rx="15" fill="#111B2A" stroke="#4D8EFF"/>
  <text x="102" y="207" fill="#79A8FF" font-family="Arial,sans-serif" font-size="16" font-weight="700">A · ORIGINAL RESPONSE</text>
  <text x="102" y="238" fill="#DFE8F7" font-family="monospace" font-size="17">&lt;div id="root"&gt;... useful HTML ...&lt;/div&gt;</text>
  <rect x="72" y="284" width="1056" height="92" rx="15" fill="#141B19" stroke="#00E87A"/>
  <text x="102" y="321" fill="#00E87A" font-family="Arial,sans-serif" font-size="16" font-weight="700">B · BROWSER AFTER JAVASCRIPT</text>
  <text x="102" y="352" fill="#DFE8E2" font-family="Arial,sans-serif" font-size="18">Check the live DOM, console errors, requests, and loaded content.</text>
  <rect x="72" y="398" width="1056" height="92" rx="15" fill="#201A12" stroke="#F5A623"/>
  <text x="102" y="435" fill="#F5A623" font-family="Arial,sans-serif" font-size="16" font-weight="700">C · SEARCH CONSOLE LIVE TEST</text>
  <text x="102" y="466" fill="#F0E7D8" font-family="Arial,sans-serif" font-size="18">Check what Google can fetch and render; indexing is still a separate decision.</text>
  <path d="M600 262v18m0 96v18" stroke="#6B7890" stroke-width="3" stroke-dasharray="5 7"/>
  <rect x="72" y="526" width="1056" height="54" rx="12" fill="#141923"/>
  <text x="102" y="561" fill="#BEC9DA" font-family="Arial,sans-serif" font-size="17">A complete browser view does not prove that the original response contains the same content.</text>
</svg>
