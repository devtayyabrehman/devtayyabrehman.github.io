<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" rx="28" fill="#101725"/>
  <path d="M0 0h1200v630H0z" fill="url(#bg)"/>
  <text x="76" y="98" fill="#EAF2FF" font-family="Arial,sans-serif" font-size="34" font-weight="700">What Search Actually Receives</text>
  <text x="76" y="139" fill="#9CAAC1" font-family="Arial,sans-serif" font-size="20">A rendering path is not the same as the first HTML response.</text>
  <rect x="76" y="222" width="294" height="202" rx="20" fill="#111A2A" stroke="#4D8EFF" stroke-width="2"/>
  <text x="108" y="277" fill="#4D8EFF" font-family="Arial,sans-serif" font-size="19" font-weight="700">1 · FETCH</text>
  <text x="108" y="326" fill="#F2F5FA" font-family="Arial,sans-serif" font-size="27" font-weight="700">Initial HTML</text>
  <text x="108" y="368" fill="#AAB5C7" font-family="Arial,sans-serif" font-size="19">Content, links, status,</text>
  <text x="108" y="396" fill="#AAB5C7" font-family="Arial,sans-serif" font-size="19">canonical, directives</text>
  <path d="M388 323h92m-17-16 17 16-17 16" stroke="#8BAAF5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="486" y="222" width="294" height="202" rx="20" fill="#111A2A" stroke="#00E87A" stroke-width="2"/>
  <text x="518" y="277" fill="#00E87A" font-family="Arial,sans-serif" font-size="19" font-weight="700">2 · RENDER</text>
  <text x="518" y="326" fill="#F2F5FA" font-family="Arial,sans-serif" font-size="27" font-weight="700">Run JavaScript</text>
  <text x="518" y="368" fill="#AAB5C7" font-family="Arial,sans-serif" font-size="19">Scripts and data must</text>
  <text x="518" y="396" fill="#AAB5C7" font-family="Arial,sans-serif" font-size="19">load and execute</text>
  <path d="M798 323h92m-17-16 17 16-17 16" stroke="#8BAAF5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="896" y="222" width="228" height="202" rx="20" fill="#111A2A" stroke="#F5A623" stroke-width="2"/>
  <text x="924" y="277" fill="#F5A623" font-family="Arial,sans-serif" font-size="19" font-weight="700">3 · EVALUATE</text>
  <text x="924" y="326" fill="#F2F5FA" font-family="Arial,sans-serif" font-size="27" font-weight="700">Index?</text>
  <text x="924" y="368" fill="#AAB5C7" font-family="Arial,sans-serif" font-size="19">Canonical, value,</text>
  <text x="924" y="396" fill="#AAB5C7" font-family="Arial,sans-serif" font-size="19">eligibility and choice</text>
  <rect x="76" y="474" width="1048" height="82" rx="16" fill="#0C111C" stroke="#29364A"/>
  <text x="108" y="524" fill="#D8E2F2" font-family="Arial,sans-serif" font-size="21">SSR/prerendering: send useful public HTML in step one; enhance it later.</text>
  <defs><linearGradient id="bg" x1="77" y1="43" x2="1111" y2="616" gradientUnits="userSpaceOnUse"><stop stop-color="#4D8EFF" stop-opacity=".16"/><stop offset="1" stop-color="#07080D" stop-opacity="0"/></linearGradient></defs>
</svg>
