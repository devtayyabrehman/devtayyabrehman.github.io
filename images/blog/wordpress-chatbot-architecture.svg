<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" rx="28" fill="#171322"/>
  <text x="76" y="96" fill="#F5F0FF" font-family="Arial,sans-serif" font-size="34" font-weight="700">A Safer WordPress Chatbot</text>
  <text x="76" y="137" fill="#B8ADC9" font-family="Arial,sans-serif" font-size="20">The browser never receives the provider secret.</text>
  <rect x="74" y="224" width="232" height="196" rx="22" fill="#211B2D" stroke="#A78BFA" stroke-width="2"/>
  <text x="106" y="274" fill="#C4A9FF" font-family="Arial,sans-serif" font-size="18" font-weight="700">VISITOR WIDGET</text>
  <path d="M106 301h162m-162 27h129m-129 27h148" stroke="#786A91" stroke-width="8" stroke-linecap="round"/>
  <text x="106" y="397" fill="#C5BBD4" font-family="Arial,sans-serif" font-size="16">Message + consent</text>
  <path d="M330 316h126m-18-17 18 17-18 17" stroke="#C2A9FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="471" y="205" width="300" height="234" rx="22" fill="#171D2A" stroke="#4D8EFF" stroke-width="2"/>
  <text x="505" y="256" fill="#7EABFF" font-family="Arial,sans-serif" font-size="18" font-weight="700">WORDPRESS SERVER</text>
  <text x="505" y="302" fill="#F1F4FB" font-family="Arial,sans-serif" font-size="21" font-weight="700">Validate · limit</text>
  <text x="505" y="339" fill="#B3BED1" font-family="Arial,sans-serif" font-size="18">Check permissions</text>
  <text x="505" y="373" fill="#B3BED1" font-family="Arial,sans-serif" font-size="18">Keep provider key private</text>
  <text x="505" y="407" fill="#B3BED1" font-family="Arial,sans-serif" font-size="18">Apply approved sources</text>
  <path d="M794 316h126m-18-17 18 17-18 17" stroke="#C2A9FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="935" y="224" width="190" height="196" rx="22" fill="#18231E" stroke="#00E87A" stroke-width="2"/>
  <text x="967" y="274" fill="#00E87A" font-family="Arial,sans-serif" font-size="18" font-weight="700">SAFE RESPONSE</text>
  <text x="967" y="320" fill="#EAF3EC" font-family="Arial,sans-serif" font-size="19">Grounded answer</text>
  <text x="967" y="354" fill="#B3C5B9" font-family="Arial,sans-serif" font-size="17">Useful link</text>
  <text x="967" y="388" fill="#B3C5B9" font-family="Arial,sans-serif" font-size="17">Human handoff</text>
  <rect x="74" y="490" width="1051" height="70" rx="15" fill="#110E17" stroke="#40354D"/>
  <text x="106" y="535" fill="#E4DDEC" font-family="Arial,sans-serif" font-size="20">A helpful bot says “I don’t know” when the approved source is silent.</text>
</svg>
